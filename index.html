<!DOCTYPE html>
<html>
<head>
    <title>AI App Config Generator</title>
</head>
<body>

<h1>AI App Config Generator</h1>

<textarea id="requirements" rows="6" cols="50"
placeholder="Describe your app"></textarea>

<br><br>

<button onclick="generateConfig()">Generate</button>

<pre id="output"></pre>

<script>
function generateConfig() {

    const text = document
        .getElementById("requirements")
        .value
        .toLowerCase();

    let config = {
        ui: { pages: [] },
        api: { endpoints: [] },
        database: { tables: [] },
        auth: { roles: ["user"] }
    };

    if(text.includes("login")) {
        config.ui.pages.push("login");
        config.api.endpoints.push("/login");
    }

    if(text.includes("contact")) {
        config.ui.pages.push("contacts");
        config.database.tables.push("contacts");
    }

    if(text.includes("food")) {
        config.ui.pages.push("menu");
        config.database.tables.push("orders");
        config.api.endpoints.push("/orders");
    }

    if(text.includes("hospital")) {
        config.ui.pages.push("patients");
        config.database.tables.push("patients");
        config.api.endpoints.push("/patients");
    }

    document.getElementById("output").textContent =
        JSON.stringify(config, null, 2);
}
</script>

</body>
</html>
